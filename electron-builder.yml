appId: com.xiaoma.accounting
productName: 小马记账
directories:
  output: release
  buildResources: public
files:
  - dist/**/*
  - electron/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: public/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 小马记账
  installerIcon: public/icon.png
  uninstallerIcon: public/icon.png
